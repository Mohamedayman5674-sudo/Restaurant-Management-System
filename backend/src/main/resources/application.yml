server:
  port: 9090

spring:
  application:
    name: Restaurant

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/orclpdb}
    username: ${DB_USERNAME:hr}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  messages:
    basename: i18n/messages
    locale-default: ar

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

token:
  secret: ${TOKEN_SECRET}
  time: 24h
