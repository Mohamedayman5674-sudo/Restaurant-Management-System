<div class="tab-content" *ngIf="products.length > 0">

  <div id="tab-1" class="tab-pane fade show p-0 active">

    <div class="row g-4">

      <div class="col-lg-6" *ngFor="let product of products">

        <div class="d-flex align-items-center">

          <img
            class="flex-shrink-0 img-fluid rounded"
            [src]="'/assets/img/' + product.imagePath"
            [alt]="product.name"
            style="width:80px;height:80px;object-fit:cover;">

          <div class="w-100 d-flex flex-column text-start ps-4">

            <h5 class="d-flex justify-content-between border-bottom pb-2">

              <span>
                {{product.name}}
              </span>

              <span class="text-primary">
                ${{product.price}}
              </span>

            </h5>

            <small class="fst-italic">
              {{product.description}}
            </small>

            <!-- Add To Cart -->

            <div class="d-flex gap-2 mt-2">

              <button
                type="button"
                class="btn btn-danger"
                (click)="addToCart(product)">

                ADD TO CART

              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- Information -->

<div
  class="info-section mt-4"
  *ngIf="messageEn || messageAr">

  <div class="info-header">

    <span class="info-icon">
      <i class="fa fa-info-circle"></i>
    </span>

    <h3 class="d-inline ms-2">
      Information
    </h3>

  </div>

  <div class="info-content mt-3">

    <div class="message-box mb-3">

      <label>
        <strong>Arabic Message</strong>
      </label>

      <p>
        {{messageAr}}
      </p>

    </div>

    <div class="message-box">

      <label>
        <strong>English Message</strong>
      </label>

      <p>
        {{messageEn}}
      </p>

    </div>

  </div>

</div>


<hr>


<!-- Pagination -->

<div class="row mt-4">

  <div
    class="col-md-12 d-flex justify-content-center align-items-center">

    <!-- Previous -->

    <button
      type="button"
      class="btn btn-secondary me-3"
      (click)="previousPage()"
      [disabled]="currentPage == 1">

      Previous

    </button>


    <!-- Page Numbers -->

    <ul class="pagination mb-0">

      <li
        class="page-item"
        *ngFor="let page of pages"
        [class.active]="page == currentPage">

        <button
          type="button"
          class="page-link"
          (click)="goToPage(page)">

          {{page}}

        </button>

      </li>

    </ul>


    <!-- Next -->

    <button
      type="button"
      class="btn btn-primary ms-3"
      (click)="nextPage()"
      [disabled]="currentPage == totalPages">

      Next

    </button>

  </div>

</div>


<!-- Page Size -->

<div class="row mt-3">

  <div class="col-md-12 text-center">

    <span class="me-2">
      Page Size
    </span>

    <select
      class="form-select d-inline-block"
      style="width:120px"
      [(ngModel)]="pageSize"
      (ngModelChange)="changePageSize($event)">

      <option [ngValue]="2">
        2
      </option>

      <option [ngValue]="5">
        5
      </option>

      <option [ngValue]="10">
        10
      </option>

      <option [ngValue]="20">
        20
      </option>

      <option [ngValue]="50">
        50
      </option>

    </select>

  </div>

</div>
