<!-- Navbar & Hero Start -->
<div class="container-xxl position-relative p-0">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0">

    <a routerLink="/products" class="navbar-brand p-0">
      <h1 class="text-primary m-0">
        <i class="fa fa-utensils me-3"></i>Restoran
      </h1>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarCollapse">

      <span class="fa fa-bars"></span>

    </button>

    <!-- Search -->
    <div class="search" *ngIf="isUserLogin()">

      <input
        class="form-control"
        type="search"
        placeholder="Search"
        aria-label="Search"
        #key>

      <button
        class="btn btn-outline-success"
        type="submit"
        (click)="search(key.value)">

        Search

      </button>

    </div>

    <div
      class="collapse navbar-collapse"
      id="navbarCollapse">

      <div class="navbar-nav ms-auto py-0 pe-4">

        <!-- Contact -->
        <div
          *ngIf="isUserLogin()"
          class="nav-item nav-link active">

          <a routerLink="/contact-info">
            Contact
          </a>

        </div>

        <!-- Team -->
        <div
          *ngIf="isUserLogin()"
          class="nav-item nav-link active">

          <a routerLink="/chefs">
            Team
          </a>

        </div>

        <!-- Category -->
        <div
          *ngIf="isUserLogin()"
          class="nav-item dropdown">

          <a
            href="javascript:void(0)"
            class="nav-link dropdown-toggle"
            data-bs-toggle="dropdown">

            Category

          </a>

          <div class="dropdown-menu m-0">

            <a
              *ngFor="let category of categories"
              class="dropdown-item"
              [routerLink]="category.name === 'ALL'
                ? ['/products']
                : ['/category', category.id]">

              {{ category.name }}

            </a>

          </div>

        </div>

        <!-- User -->
        <div
          *ngIf="isUserLogin() && !isAdmin()"
          class="nav-item dropdown">

          <a
            href="javascript:void(0)"
            class="nav-link dropdown-toggle"
            data-bs-toggle="dropdown">

            My Account

          </a>

          <div class="dropdown-menu m-0">

            <a
              class="dropdown-item"
              routerLink="/orders">

              My Orders

            </a>

          </div>

        </div>

        <!-- Admin -->
        <div
          *ngIf="isUserLogin() && isAdmin()"
          class="nav-item dropdown">

          <a
            href="javascript:void(0)"
            class="nav-link dropdown-toggle"
            data-bs-toggle="dropdown">

            Admin

          </a>

          <div class="dropdown-menu m-0">

            <!-- Dashboard -->
            <a
              class="dropdown-item"
              routerLink="/admin/dashboard">

              Dashboard

            </a>

            <!-- Categories -->
            <a
              class="dropdown-item"
              routerLink="/admin/categories">

              Categories Management

            </a>

            <!-- Products -->
            <a
              class="dropdown-item"
              routerLink="/admin/products">

              Products Management

            </a>

            <!-- Chefs -->
            <a
              class="dropdown-item"
              routerLink="/admin/chefs">

              Chef Management

            </a>

            <!-- Users -->
            <a
              class="dropdown-item"
              routerLink="/admin/users">

              User Management

            </a>

            <!-- Product Details -->
            <a
              class="dropdown-item"
              routerLink="/admin/product-details">

              Product Details Management

            </a>

            <!-- Contact Information -->
            <a
              class="dropdown-item"
              routerLink="/admin/contact-information">

              Contact Information Management

            </a>

            <!-- Orders -->
            <a
              class="dropdown-item"
              routerLink="/admin/orders">

              All Orders

            </a>


          </div>

        </div>

      </div>

      <!-- Login -->
      <div
        *ngIf="!isUserLogin()"
        class="nav-item nav-link active">

        <a routerLink="/login">
          Login
        </a>

      </div>

      <!-- Signup -->
      <div
        *ngIf="!isUserLogin()"
        class="nav-item nav-link active">

        <a routerLink="/signup">
          Signup
        </a>

      </div>

      <!-- Logout -->
      <div
        *ngIf="isUserLogin()"
        class="nav-item nav-link active">

        <a
          routerLink="/login"
          (click)="logout()">

          Logout

        </a>

      </div>

    </div>

    <!-- Cart -->
    <app-card *ngIf="isUserLogin()"></app-card>

  </nav>

  <div class="container-xxl py-5 bg-dark hero-header mb-5">
  </div>

</div>
<!-- Navbar & Hero End -->
